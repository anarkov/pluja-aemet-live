name: AEMET warnings

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: publish-aemet-warnings
  cancel-in-progress: false

jobs:
  publish-warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geographic dependencies
        run: python -m pip install --disable-pip-version-check pyshp pyproj

      - name: Build official CAP warnings and Meteoalerta zones
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python scripts/publish_aemet_warnings.py

      - name: Commit changed public feed
        run: |
          git add warnings/warnings.json warnings/zones.geojson
          if git diff --cached --quiet; then
            echo "No official warning feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update AEMET warnings"
          git push
